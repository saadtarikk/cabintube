name: cabintube
services:
  app:
    build: .
    image: cabintube:local
    restart: unless-stopped
    command: [node, --import, tsx, server/index.ts]
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4318
      YTDLP_BIN: /opt/resolver/bin/yt-dlp
      SESSION_FILE: /data/sessions.enc
    ports:
      - "127.0.0.1:4318:4318"
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop: [ALL]
    # This host denies exec when Docker no-new-privileges is enabled.
    # Keep non-root USER, dropped capabilities and read-only rootfs.
    mem_limit: 768m
    cpus: 1.5
    pids_limit: 128
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4318/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
